   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #193548" x="475.2" y="50.123931" transform="rotate(-0 475.2 50.123931)">CopySafe 是执行策略，Repair 是其中使用的网络</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #546877" x="475.2" y="71.1504" transform="rotate(-0 475.2 71.1504)">每个任务 / 模型种子训练两套网络：Repair（参考旧答案与修改）和 Recompute（从新图求解）</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #193548" x="475.2" y="127.723553" transform="rotate(-0 475.2 127.723553)">共同首段：Repair 编码 → 全图传播 R 步 → 解码</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #546877" x="475.2" y="155.025811" transform="rotate(-0 475.2 155.025811)">产生新候选答案与安全分数；CPU 沿候选父链刷新路径值</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #193548" x="475.2" y="230.926032" transform="rotate(-0 475.2 230.926032)">按安全分数混合：可复制的节点用旧答案，其余用新候选</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #546877" x="475.2" y="258.446611" transform="rotate(-0 475.2 258.446611)">复制需同时满足：可达、非源节点、有旧父节点、分数 ≥ 校准阈值</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #193548" transform="translate(438.45 355.801622)">整图检查通过？</text>
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; fill: #193548" transform="translate(411.999844 368.483981)">父链 / 路径值 / 最优性约束</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #24674d" x="244.9656" y="344.4768" transform="rotate(-0 244.9656 344.4768)">通过</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #965500" x="709.9488" y="344.4768" transform="rotate(-0 709.9488 344.4768)">失败</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #193548" x="195.3072" y="474.703632" transform="rotate(-0 195.3072 474.703632)">两种策略在此分开</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #546877" x="195.3072" y="502.224211" transform="rotate(-0 195.3072 502.224211)">见下方两条“通过”分支</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #193548" x="764.1216" y="474.703632" transform="rotate(-0 764.1216 474.703632)">两种策略：相同回退</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; fill: #546877" transform="translate(711.8716 495.090676)">丢弃混合答案；独立编码</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; fill: #546877" transform="translate(702.729334 509.357746)">Recompute 再算 8 步并解码</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #193548" x="195.3072" y="585.69671" transform="rotate(-0 195.3072 585.69671)">CopySafe：直接返回混合答案</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #546877" x="195.3072" y="613.032211" transform="rotate(-0 195.3072 613.032211)">总 R 步；保留复制标记</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #193548" x="484.2288" y="543.404592" transform="rotate(-0 484.2288 543.404592)">通过后续算</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; fill: #546877" transform="translate(446.2288 584.758741)">沿用混合前隐状态</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; fill: #546877" transform="translate(434.400558 599.025812)">Repair 再算 8 步并解码</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; fill: #546877" transform="translate(427.2288 612.778546)">返回新输出，清空复制标记</text>
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; fill: #546877" transform="translate(462.507941 626.53128)">总 R+8 步</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #193548" x="764.1216" y="585.511632" transform="rotate(-0 764.1216 585.511632)">返回回退新输出</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #546877" x="764.1216" y="613.032211" transform="rotate(-0 764.1216 613.032211)">总 R+8 步；清空复制标记</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9.7px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #193548" x="475.2" y="684.288" transform="rotate(-0 475.2 684.288)">续算不会把混合答案重新输入网络，也不会重新套用旧复制掩码。回退和续算均不自动做第二次整图检查。</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9.5px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #546877" x="475.2" y="713.8368" transform="rotate(-0 475.2 713.8368)">门控分数产生前已计算完整首段 MLP；R 是推理传播步数。整图检查只读当前输入与候选答案，容差 1e−5。</text>
   </g>
   <g id="text_22">
    <text style="font-size: 9.2px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #546877" x="475.2" y="743.3856" transform="rotate(-0 475.2 743.3856)">依据固定实现与35条已保存旧权重执行记录；本图解释执行逻辑，不代表正式新模型表现。</text>
   </g>
  </g>
 </g>
